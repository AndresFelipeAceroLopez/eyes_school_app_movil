name: eyes_school
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.7
  shared_preferences: ^2.3.4
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  open_filex: ^4.5.0
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Solo para tool/make_transparent_gif.dart: recorta el fondo blanco de los
  # GIF de la mascota antes de publicarlos en assets/.
  image: ^4.9.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
