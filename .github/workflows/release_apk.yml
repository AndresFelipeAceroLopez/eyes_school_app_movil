name: Release APK

on:
  push:
    tags:
      - 'v*' # Se ejecuta al subir un tag como v1.0.0

jobs:
  build_and_release:
    name: Build and Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      # La version del APK sale del tag (v1.2.3 -> 1.2.3). Si saliera del
      # pubspec, un tag sin el pubspec actualizado publicaria un APK con
      # version vieja y la actualizacion OTA lo ofreceria en un ciclo sin fin.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
